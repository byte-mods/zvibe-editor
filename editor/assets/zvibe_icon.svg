<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <g fill="none" stroke="#9a6cd0" stroke-linecap="round" stroke-linejoin="round">
    <!-- cable: from top, S-bend down into the controller plug -->
    <path d="M512 40 v88 q0 28 28 28 h140 q28 0 28 28 t-28 28 H392 q-30 0 -30 30 t30 30 h120 q30 0 30 30 v46" stroke-width="34"/>
    <!-- controller body -->
    <path d="M330 372 h364 q120 0 138 118 l26 170 q10 78 -52 104 t-118 -22 l-54 -58 q-22 -24 -56 -24 h-132 q-34 0 -56 24 l-54 58 q-56 70 -118 22 t-52 -104 l26 -170 q18 -118 138 -118 z" stroke-width="30"/>
  </g>
  <g fill="#9a6cd0">
    <!-- plug bump where cable meets body -->
    <path d="M462 372 a50 42 0 0 1 100 0 z"/>
    <rect x="452" y="368" width="120" height="26" rx="10"/>
    <!-- left square buttons -->
    <rect x="380" y="432" width="66" height="66" rx="14"/>
    <rect x="308" y="500" width="58" height="58" rx="12"/>
    <!-- middle dpad dashes -->
    <rect x="496" y="440" width="32" height="26" rx="4"/>
    <rect x="500" y="486" width="24" height="22" rx="4"/>
    <rect x="500" y="524" width="24" height="22" rx="4"/>
    <rect x="488" y="562" width="48" height="26" rx="4"/>
    <!-- right round buttons -->
    <circle cx="656" cy="470" r="36"/>
    <circle cx="704" cy="546" r="32"/>
    <!-- joysticks + connecting bar -->
    <rect x="470" y="612" width="90" height="30" rx="10"/>
    <circle cx="408" cy="628" r="84"/>
    <circle cx="620" cy="628" r="84"/>
  </g>
  <g fill="#ffffff">
    <circle cx="408" cy="628" r="26"/>
    <circle cx="620" cy="628" r="26"/>
  </g>
  <text x="512" y="905" text-anchor="middle" fill="#9a6cd0"
        font-family="Georgia, 'Times New Roman', serif" font-size="150" font-weight="bold">Zvibe</text>
</svg>
